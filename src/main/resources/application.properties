spring.application.name=milk-collection-backend

server.port=8080

# =========================
# MySQL
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/milk_collection_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Root@123

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JSON
# =========================

# =========================
# Error response
# =========================
server.error.include-message=always
